name: Test and publish images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep publication ordered. A new push must not cancel a partially promoted release.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: Validate deployment scripts
        run: |
          bash -n deploy/update.sh deploy/install-auto-update.sh
          shellcheck deploy/update.sh deploy/install-auto-update.sh
          python -m unittest discover -s deploy/tests -v
          docker compose config --quiet

  build:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            dockerfile: Dockerfile
          - service: telegram
            dockerfile: integrations/telegram/Dockerfile
          - service: pose
            dockerfile: integrations/pose/Dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Verify app image excludes private initialization data
        if: matrix.service == 'app'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker run --rm --network none --entrypoint python "$IMAGE" -c \
            'from pathlib import Path; assert not Path("/app/backend/seed_history.json").exists(); assert not Path("/app/.env").exists(); assert not any(Path("/data").iterdir())'

  promote:
    # No latest tag is updated unless every image and check succeeds.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the complete release
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          for service in app telegram pose; do
            image="ghcr.io/${REPOSITORY,,}-$service"
            docker buildx imagetools create --tag "$image:latest" "$image:sha-$REVISION"
          done
          echo "Published revision $REVISION for app, telegram and pose." >> "$GITHUB_STEP_SUMMARY"
