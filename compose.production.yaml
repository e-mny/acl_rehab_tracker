# Image-only deployment. Keep the project name and volume names from the existing deployment.
services:
  stride:
    image: "${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY in .env}-app:${IMAGE_TAG:-latest}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8000"
    volumes:
      - stride_data:/data
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TZ: "${TZ:-Asia/Singapore}"
      POSE_ANALYZER_URL: "http://pose:8001"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 20s

  telegram:
    profiles: [telegram]
    image: "${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY in .env}-telegram:${IMAGE_TAG:-latest}"
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_USER_ID: "${TELEGRAM_ALLOWED_USER_ID:-}"
      TELEGRAM_ALLOWED_GROUP_ID: "${TELEGRAM_ALLOWED_GROUP_ID:-}"
      STRIDE_API_TOKEN: "${STRIDE_API_TOKEN:-}"
      STRIDE_API_URL: http://stride:8000
    volumes:
      - telegram_data:/bot-data
    depends_on:
      stride:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  pose:
    profiles: [pose]
    image: "${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY in .env}-pose:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  stride_data:
    external: true
    name: "${STRIDE_DATA_VOLUME:?Set STRIDE_DATA_VOLUME to the existing journal volume}"
  telegram_data:
    external: true
    name: "${TELEGRAM_DATA_VOLUME:?Set TELEGRAM_DATA_VOLUME to the existing bot volume}"
